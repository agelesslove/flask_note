<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteDrop — Швидкі нотатки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
    <main class="container">
        <h2>📝 NoteDrop</h2>
        <p>Створіть нотатку та поділіться посиланням.</p>
        <form method="POST">
            <textarea name="content" rows="6" placeholder="Введіть ваш текст тут..." required></textarea>
            <button type="submit">Зберегти та отримати посилання</button>
        </form>
    </main>
</body>
</html>
